<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이드노트</title>
<style>
:root { --primary:#1B7F4E; --tint:#EAF5EF; --text:#191F28; --sub:#6B7684; --bg:#F2F4F6; --card:#FFFFFF; --line:#E5E8EB; }
@media (prefers-color-scheme: dark) {
  :root { --primary:#4CC38A; --tint:#12301F; --text:#ECEFF3; --sub:#A3ACB8; --bg:#101418; --card:#1A2027; --line:#2A323C; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); line-height:1.7;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; font-size:18px; word-break:keep-all; }
main { max-width:720px; margin:0 auto; padding:32px 16px 48px; }
a { color:var(--primary); }
header.site { display:flex; align-items:center; gap:8px; font-weight:800; color:var(--primary); margin-bottom:24px; }
header.site a { text-decoration:none; }
h1 { font-size:30px; line-height:1.3; margin:0 0 8px; }
h2 { font-size:21px; margin:0 0 8px; }
.lead { color:var(--sub); margin:0 0 24px; }
.card { background:var(--card); border-radius:20px; padding:20px; margin-bottom:14px; }
.card.summary { background:var(--tint); }
.card p { margin:0 0 8px; color:var(--sub); }
.card ul { margin:0; padding-left:20px; color:var(--sub); }
.card li { margin-bottom:6px; }
.card.summary li { color:var(--text); font-weight:700; }
.app { display:block; text-decoration:none; color:inherit; }
.app strong { font-size:21px; }
.app span { display:block; color:var(--sub); }
.links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.links a { display:inline-block; padding:10px 16px; border-radius:12px; background:var(--tint); text-decoration:none; font-weight:700; }
footer { color:var(--sub); font-size:15px; border-top:1px solid var(--line); margin-top:32px; padding-top:16px; }
</style>
</head>
<body>
<main>
<header class="site"><a href="./">사이드노트</a></header>
<h1>사이드노트</h1>
<p class="lead">일상을 조금 더 편하게 만드는 작은 앱을 만듭니다.</p>
<section class="card">
  <a class="app" href="jettae/"><strong>제때</strong>
  <span>복약 알림 + 혈압 기록 수첩 · Android · 2027년 1월 출시 예정</span></a>
  <div class="links"><a href="jettae/">앱 소개</a><a href="jettae/privacy/">개인정보처리방침</a></div>
</section>
<footer>사이드노트 · 대표 임채욱 · 문의 0502-1931-0079 · <a href="mailto:sidenote0803@gmail.com">sidenote0803@gmail.com</a></footer>
</main>
</body>
</html>
